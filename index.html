<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAK AI - Real ChatGPT Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{display:flex;height:100vh;background:#212121;color:#ececec}
#sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:10px;overflow:hidden}
#sidebar.item{padding:10px;border-radius:8px;cursor:pointer;color:#ececec;font-size:14px}
#sidebar.item:hover{background:#2f2f2f}
#main{flex:1;display:flex;flex-direction:column;background:#212121}
#top{padding:14px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #2f2f2f}
#chatBox{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%}
.msg{padding:16px;margin:8px 0;line-height:1.6;white-space:pre-wrap}
.msg.me{background:#2f2f2f;border-radius:18px}
.msg.ai{background:transparent}
#center{margin-top:80px;text-align:center}
#center h1{font-size:28px;margin-bottom:24px}
#center.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#center button{border:1px solid #3f3f3f;background:#2f2f2f;color:white;padding:10px 14px;border-radius:12px;cursor:pointer}
#inputArea{max-width:760px;width:92%;margin:15px auto;background:#2f2f2f;border-radius:24px;padding:10px}
#row{display:flex;gap:8px;align-items:center}
#text{flex:1;background:transparent;border:none;color:white;outline:none;font-size:16px;padding:10px}
.btn{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;background:#424242;color:white}
.btn.send{background:white;color:black}
#preview img{max-width:120px;border-radius:10px}
img.gen,video.gen{width:100%;max-width:500px;border-radius:12px;margin-top:10px;display:block}
#loginModal{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;place-items:center;z-index:10}
#loginBox{background:#2f2f2f;padding:24px;border-radius:16px;width:320px}
#loginBox input{width:100%;padding:10px;border-radius:8px;border:none;margin:10px 0}
@media(max-width:768px){#sidebar{display:none}}
</style>
</head>
<body>
<div id="sidebar">
<div style="font-weight:bold;padding:10px">GAK AI ☰</div>
<div class="item" onclick="newChat()">➕ New Chat</div>
<div class="item">🖼️ Images</div><div class="item">📚 Library</div><div class="item">📁 Projects</div>
<hr style="border:0;border-top:1px solid #333;margin:10px 0">
<div id="history"></div>
<div style="margin-top:auto"><div class="item" id="userBtn" onclick="showLogin()">👤 Login</div></div>
</div>

<div id="main">
<div id="top"><b>GAK AI</b><span>● Real ChatGPT Clone</span></div>
<div id="chatBox">
<div id="center">
<h1 id="welcome">What can I help with?</h1>
<div class="grid">
<button onclick="doQuick('Generate image of a South Sudanese village')">🖼️ Create image</button>
<button onclick="doQuick('Generate video of a lion running in savanna')">🎬 Create video</button>
<button onclick="doQuick('Search web: latest news Juba today')">🌐 Search web</button>
<button onclick="doQuick('Write a story about Juba')">✏️ Write story</button>
</div>
</div>
</div>
<div id="inputArea">
<div id="preview"></div>
<div id="row">
<input type="file" id="file" hidden accept="image/*,.pdf,.txt">
<button class="btn" onclick="file.click()">+</button>
<button class="btn" onclick="toggleVoice()">🎤</button>
<input id="text" placeholder="Ask GAK AI anything...">
<button class="btn send" onclick="send()">↑</button>
</div>
</div>
</div>

<div id="loginModal"><div id="loginBox">
<h3>Login to GAK AI</h3>
<input id="username" placeholder="Your name e.g. Gak">
<input id="useremail" placeholder="Email (optional)">
<button class="btn send" style="width:100%;border-radius:8px;height:40px" onclick="login()">Login</button>
<button onclick="hideLogin()" style="background:none;border:none;color:#aaa;margin-top:10px;cursor:pointer">Cancel</button>
</div></div>

<script>
const GROQ_KEY="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";//
const chatBox=document.getElementById("chatBox"),file=document.getElementById("file"),textEl=document.getElementById("text"),preview=document.getElementById("preview"),historyEl=document.getElementById("history");
let imgData=null, chats=JSON.parse(localStorage.getItem("gak_chats")||"[]"), currentId=null;

function showLogin(){document.getElementById("loginModal").style.display="grid";}
function hideLogin(){document.getElementById("loginModal").style.display="none";}
function login(){
 let n=document.getElementById("username").value.trim(); if(!n) return alert("Enter name");
 localStorage.setItem("gak_user",n); document.getElementById("userBtn").innerText="👤 "+n; document.getElementById("welcome").innerText="Hello "+n+", what can I help with?"; hideLogin();
}
let savedUser=localStorage.getItem("gak_user"); if(savedUser){document.getElementById("userBtn").innerText="👤 "+savedUser; document.getElementById("welcome").innerText="Hello "+savedUser+", what can I help with?";}
function newChat(){currentId=Date.now(); chats.unshift({id:currentId,title:"New chat",msgs:[]}); save(); renderHistory(); chatBox.innerHTML=document.getElementById("center").outerHTML; document.getElementById("center").style.display="block";}
function save(){localStorage.setItem("gak_chats",JSON.stringify(chats));}
function renderHistory(){historyEl.innerHTML=""; chats.forEach(c=>{historyEl.innerHTML+='<div class="item" onclick="openChat('+c.id+')">'+c.title.slice(0,24)+'</div>';});}
function openChat(id){currentId=id; let c=chats.find(x=>x.id==id); chatBox.innerHTML=""; c.msgs.forEach(m=>{chatBox.innerHTML+='<div class="msg '+(m.role=="user"?"me":"ai")+'">'+m.text+'</div>';});}
renderHistory();

file.addEventListener("change",e=>{
 let f=e.target.files[0]; if(!f) return;
 if(f.type.startsWith("image/")){
  let r=new FileReader(); r.onload=ev=>{imgData=ev.target.result; preview.innerHTML='<img src="'+imgData+'"><br><small>'+f.name+'</small>';}; r.readAsDataURL(f);
 } else preview.innerHTML="📄 "+f.name;
 document.getElementById("center").style.display="none";
});
function toggleVoice(){let R=new (window.SpeechRecognition||window.webkitSpeechRecognition)(); R.onresult=e=>{textEl.value=e.results[0][0].transcript; send();}; R.start();}
function doQuick(t){textEl.value=t; send();}
async function send(){
 let t=textEl.value.trim(); if(!t &&!imgData) return;
 if(!currentId){currentId=Date.now(); chats.unshift({id:currentId,title:t.slice(0,25),msgs:[]});}
 let cur=chats.find(x=>x.id==currentId); cur.title=t.slice(0,30);
 document.getElementById("center")?.remove();
 let userHtml=t+(imgData?'<br><img src="'+imgData+'" class="gen">':"");
 chatBox.innerHTML+='<div class="msg me">'+userHtml+'</div>'; cur.msgs.push({role:"user",text:userHtml});
 textEl.value=""; let id="L"+Date.now(); chatBox.innerHTML+='<div class="msg ai" id="'+id+'">Thinking...</div>'; chatBox.scrollTop=chatBox.scrollHeight;
 let low=t.toLowerCase();

 // REAL IMAGE
 if((low.includes("image")||low.includes("photo")||low.includes("picture")||low.includes("draw")) && (low.includes("generate")||low.includes("create"))){
  let p=t.replace(/generate|create|image|photo|picture|of/gi,"").trim()||"beautiful"; let seed=Math.floor(Math.random()*99999);
  let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(p)+"?width=768&height=768&seed="+seed+"&nologo=true&enhance=true";
  document.getElementById(id).remove(); let html='Generated Image:<br><img class="gen" src="'+url+'" onload="this.scrollIntoView()"> <br><small>'+p+'</small>';
  chatBox.innerHTML+='<div class="msg ai">'+html+'</div>'; cur.msgs.push({role:"ai",text:html}); save(); renderHistory(); preview.innerHTML=""; imgData=null; return;
 }
 // REAL VIDEO
 if(low.includes("video") && (low.includes("generate")||low.includes("create"))){
  let p=t.replace(/generate|create|video|of/gi,"").trim()||"cinematic"; let seed=Math.floor(Math.random()*99999);
  let mp4="https://gen.pollinations.ai/video/"+encodeURIComponent(p)+"?seed="+seed;
  document.getElementById(id).remove(); let html='Generated Video:<br><video class="gen" controls autoplay loop muted><source src="'+mp4+'" type="video/mp4"></video><br><small>'+p+' - if not playing, wait 20s</small>';
  chatBox.innerHTML+='<div class="msg ai">'+html+'</div>'; cur.msgs.push({role:"ai",text:html}); save(); renderHistory(); preview.innerHTML=""; return;
 }
 // REAL WEB SEARCH (free DuckDuckGo)
 if(low.includes("search web")||low.includes("search the web")||low.startsWith("search:")){
  document.getElementById(id).innerText="Searching web...";
  try{
   let q=t.replace(/search web:|search the web:|search:/gi,"").trim();
   let r=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1"); let d=await r.json();
   let result=d.AbstractText||d.RelatedTopics?.[0]?.Text||"No direct result, but I can answer with AI.";
   document.getElementById(id).remove(); let html="🔍 Web Search: "+q+"<br><br>"+result;
   chatBox.innerHTML+='<div class="msg ai">'+html+'</div>'; cur.msgs.push({role:"ai",text:html}); save(); return;
  }catch(e){}
 }

 // REAL CHAT + VISION
 try{
  let model=imgData?"meta-llama/llama-4-scout-17b-16e-instruct":"openai/gpt-oss-20b";
  let msgs=imgData?[{role:"user",content:[{type:"text",text:t},{type:"image_url",image_url:{url:imgData}}]}]:[{role:"user",content:t}];
  let r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},body:JSON.stringify({model:model,messages:msgs})});
  let d=await r.json(); document.getElementById(id).remove();
  if(d.error){chatBox.innerHTML+='<div class="msg ai">Error: '+d.error.message+'</div>'; return;}
  let reply=d.choices[0].message.content;
  // Voice answer
  if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(reply.slice(0,200)); speechSynthesis.speak(u);}
  chatBox.innerHTML+='<div class="msg ai">'+reply+'</div>'; cur.msgs.push({role:"ai",text:reply}); save(); renderHistory();
 }catch(e){document.getElementById(id).remove(); chatBox.innerHTML+='<div class="msg ai">Error: '+e.message+'</div>';}
 preview.innerHTML=""; imgData=null; chatBox.scrollTop=chatBox.scrollHeight;
}
textEl.addEventListener("keydown",e=>{if(e.key==="Enter")send();});
</script>
</body>
</html>
