<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GAK AI</title>
<style>body{background:#0f172a;color:white;font-family:sans-serif;display:flex;justify-content:center;padding:10px;margin:0}.container{width:100%;max-width:600px;background:#1e293b;border-radius:15px;padding:15px;min-height:90vh;display:flex;flex-direction:column}#chatBox{flex:1;height:500px;overflow-y:auto;background:#0f172a;border-radius:10px;padding:15px;margin:15px 0}.msg{margin:12px 0;line-height:1.5}.user{color:#60a5fa;font-weight:bold}.ai{color:#4ade80;white-space:pre-wrap}.preview{max-width:200px;border-radius:10px}.input-area{display:flex;gap:8px;align-items:center;background:#0f172a;padding:10px;border-radius:25px}input{flex:1;padding:12px;border-radius:20px;border:none;outline:none;background:transparent;color:white}#plusBtn{background:#2d3748;border:none;color:white;font-size:22px;width:40px;height:40px;border-radius:50%}#sendBtn{background:#3b82f6;color:white;border:none;padding:12px 20px;border-radius:20px;font-weight:bold}</style></head>
<body><div class="container"><h2>🇸🇸 GAK AI - Works!</h2><div id="chatBox"><div class="msg ai">Hello! I am GAK AI. No API key needed! Ask me anything!</div></div>
<div class="input-area"><button id="plusBtn" onclick="document.getElementById('photoInput').click()">+</button><input id="userInput" placeholder="Ask, upload image..." onkeypress="if(event.key==='Enter')send()"><button id="sendBtn" onclick="send()">Send</button></div>
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handleFile(this)"><div id="filePreview"></div></div>
<script>
let attachedBase64=null;
function handleFile(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{attachedBase64=e.target.result;document.getElementById('filePreview').innerHTML=`<img src="${e.target.result}" class="preview"> <span onclick="clearFile()" style="color:red;cursor:pointer"> X Remove</span>`;};r.readAsDataURL(f);}
function clearFile(){attachedBase64=null;document.getElementById('filePreview').innerHTML='';document.getElementById('photoInput').value='';}
async function send(){const input=document.getElementById('userInput');const box=document.getElementById('chatBox');let text=input.value.trim();if(!text&&!attachedBase64)return;box.innerHTML+=`<div class="msg user">You: ${text}</div>`;if(attachedBase64)box.innerHTML+=`<img src="${attachedBase64}" class="preview">`;const q=text;input.value='';const id='l'+Date.now();box.innerHTML+=`<div class="msg ai" id="${id}">GAK AI: Thinking...</div>`;box.scrollTop=box.scrollHeight;try{let prompt=q;if(attachedBase64)prompt=`User uploaded an image. User asks: ${q}. Describe what you can and answer.`;const res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));const data=await res.text();document.getElementById(id).innerText='GAK AI: '+data;}catch(e){document.getElementById(id).innerText='Error: '+e.message;}clearFile();box.scrollTop=box.scrollHeight;}
</script></body></html>
