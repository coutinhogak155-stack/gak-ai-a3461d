<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GAK AI - South Sudanese AI</title>

  <meta
    name="description"
    content="GAK AI is an AI assistant created and built by Cotino Gak, whose real name is Isaiah Gak Agok."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --sidebar: #0d0d0d;
      --panel: #111111;
      --panel2: #171717;
      --border: #292929;
      --text: #ffffff;
      --muted: #999999;
      --accent: #ffffff;
      --user: #242424;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    /* =========================
       MAIN LAYOUT
    ========================= */

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 28px;
    }

    .logo span {
      color: #49e38a;
      font-size: 12px;
      margin-left: 5px;
      vertical-align: middle;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      background: #171717;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .new-chat:hover {
      background: #222;
    }

    .side-title {
      color: #777;
      font-size: 12px;
      margin: 10px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .recent {
      color: #aaa;
      font-size: 13px;
      padding: 9px;
      border-radius: 7px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent:hover {
      background: #191919;
      color: white;
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    .creator-box {
      border-top: 1px solid var(--border);
      padding-top: 15px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.6;
    }

    .creator-box strong {
      color: white;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      flex-shrink: 0;
    }

    .top-title {
      font-weight: 700;
      font-size: 16px;
    }

    .status {
      font-size: 12px;
      color: #49e38a;
    }

    /* =========================
       CHAT AREA
    ========================= */

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 180px;
    }

    .welcome {
      max-width: 850px;
      margin: 70px auto 35px;
      text-align: center;
    }

    .welcome-logo {
      font-size: 45px;
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #999;
      font-size: 15px;
    }

    .cards {
      max-width: 850px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border);
      background: #101010;
      padding: 18px;
      border-radius: 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      background: #181818;
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .card-text {
      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      max-width: 850px;
      margin: auto;
    }

    .message {
      margin: 18px 0;
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      background: #222;
    }

    .message.user .avatar {
      background: white;
      color: black;
    }

    .message-content {
      max-width: calc(100% - 45px);
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: var(--user);
      padding: 11px 15px;
      border-radius: 13px;
    }

    .message.ai .message-content {
      padding-top: 5px;
    }

    .message-actions {
      margin-top: 8px;
    }

    .copy-btn {
      border: none;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 11px;
    }

    .copy-btn:hover {
      color: white;
    }

    .generated-image {
      max-width: 100%;
      width: 600px;
      border-radius: 14px;
      margin-top: 10px;
      border: 1px solid var(--border);
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
      position: fixed;
      bottom: 0;
      left: 260px;
      right: 0;
      background: linear-gradient(
        transparent,
        rgba(8,8,8,0.96) 35%
      );
      padding: 25px 20px 20px;
    }

    .composer {
      max-width: 850px;
      margin: auto;
      border: 1px solid #333;
      background: #111;
      border-radius: 17px;
      padding: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    textarea {
      width: 100%;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      resize: none;
      min-height: 50px;
      max-height: 180px;
      font-size: 14px;
      padding: 7px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #666;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 7px;
    }

    .composer-tools {
      display: flex;
      gap: 7px;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid #2b2b2b;
      color: #aaa;
      width: 35px;
      height: 35px;
      border-radius: 9px;
      cursor: pointer;
    }

    .tool-btn:hover {
      background: #222;
      color: white;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: white;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:hover {
      background: #ddd;
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       API SETTINGS
    ========================= */

    .settings {
      position: fixed;
      right: 20px;
      top: 75px;
      width: 350px;
      background: #121212;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 18px;
      display: none;
      z-index: 100;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }

    .settings.show {
      display: block;
    }

    .settings h3 {
      margin-bottom: 8px;
    }

    .settings p {
      color: #888;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .api-input {
      width: 100%;
      padding: 12px;
      background: #080808;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
      outline: none;
      margin-bottom: 10px;
    }

    .save-key {
      width: 100%;
      padding: 11px;
      border: none;
      background: white;
      color: black;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* =========================
       LOADING
    ========================= */

    .typing {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #888;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .sidebar {
        display: none;
      }

      .composer-wrap {
        left: 0;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .welcome {
        margin-top: 35px;
      }

      .welcome-logo {
        font-size: 36px;
      }

      .settings {
        left: 15px;
        right: 15px;
        width: auto;
      }
    }

    @media (max-width: 450px) {

      .chat-area {
        padding-left: 12px;
        padding-right: 12px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0 14px;
      }
    }
  </style>
</head>
