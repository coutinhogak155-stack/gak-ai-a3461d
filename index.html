<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAK AI</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;margin:0}
#box{padding:15px;padding-bottom:80px;max-width:700px;margin:auto}
.msg{background:#1e293b;padding:12px;border-radius:12px;margin:10px 0}
.msg.ai{border-left:4px solid #22c55e}
#inputArea{position:fixed;bottom:0;left:0;right:0;background:#0f172a;padding:10px;display:flex;gap:8px}
input{flex:1;padding:12px;border-radius:20px;border:none}
button{padding:12px 18px;border-radius:20px;border:none;background:#22c55e;color:white;font-weight:bold}
img.gen,video.gen{width:100%;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<div id="box"><div class="msg ai">GAK AI Ready! Try: generate image of a lion</div></div>
<div id="inputArea"><input id="text" placeholder="Type here..."><button onclick="send()">Send</button></div>
<script>
const GROQ_KEY = "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";//
async function send(){
 let t=document.getElementById("text").value.trim();
 if(!t) return;
 let box=document.getElementById("box");
 box.innerHTML+='<div class="msg">You: '+t+'</div>';
 document.getElementById("text").value='';
 let id="L"+Date.now();
 box.innerHTML+='<div class="msg ai" id="'+id+'">Thinking...</div>';
 window.scrollTo(0,document.body.scrollHeight);
 let low=t.toLowerCase();
 if(low.includes("generate") && (low.includes("image")||low.includes("photo")||low.includes("draw"))){
   let p=t.replace(/generate/gi,"").replace(/image/gi,"").replace(/photo/gi,"").replace(/draw/gi,"").replace(/of/gi,"").trim();
   if(p.length<2) p="beautiful landscape";
   let seed=Math.floor(Math.random()*999999);
   let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(p)+"?width=768&height=768&seed="+seed+"&nologo=true";
   document.getElementById(id).remove();
   box.innerHTML+='<div class="msg ai">Generated Image:<br><img class="gen" src="'+url+'"><br>Prompt: '+p+'</div>';
   return;
 }
 if(low.includes("generate") && low.includes("video")){
   let p=t.replace(/generate/gi,"").replace(/video/gi,"").replace(/of/gi,"").trim();
   if(p.length<2) p="cinematic nature";
   let seed=Math.floor(Math.random()*999999);
   let mp4="https://gen.pollinations.ai/video/"+encodeURIComponent(p)+"?seed="+seed;
   document.getElementById(id).remove();
   box.innerHTML+='<div class="msg ai">Generated Video:<br><video class="gen" controls autoplay loop muted><source src="'+mp4+'" type="video/mp4"></video><br>Prompt: '+p+'</div>';
   return;
 }
 try{
  let r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},body:JSON.stringify({model:"openai/gpt-oss-20b",messages:[{role:"user",content:t}]})});
  let d=await r.json();
  document.getElementById(id).remove();
  if(d.error){box.innerHTML+='<div class="msg ai">Error: '+d.error.message+'</div>';return;}
  box.innerHTML+='<div class="msg ai">GAK AI: '+d.choices[0].message.content+'</div>';
 }catch(e){document.getElementById(id).remove();box.innerHTML+='<div class="msg ai">Error: '+e.message+'</div>';}
}
document.getElementById("text").addEventListener("keydown",function(e){if(e.key==="Enter")send();});
</script>
</body>
</html>
