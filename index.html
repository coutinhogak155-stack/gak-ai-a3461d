<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GAK AI</title>
<style>body{background:#0f172a;color:white;font-family:sans-serif;display:flex;justify-content:center;padding:10px;margin:0}.container{width:100%;max-width:600px;background:#1e293b;border-radius:15px;padding:15px;min-height:90vh;display:flex;flex-direction:column}#chatBox{flex:1;height:450px;overflow-y:auto;background:#0f172a;border-radius:10px;padding:15px;margin:15px 0}.msg{margin:12px 0}.user{color:#60a5fa;font-weight:bold}.ai{color:#4ade80;white-space:pre-wrap}.preview{max-width:200px;border-radius:10px}.input-area{display:flex;gap:8px;align-items:center;background:#0f172a;padding:10px;border-radius:25px}input{flex:1;padding:12px;border-radius:20px;border:none;outline:none;background:transparent;color:white}#plusBtn{background:#2d3748;border:none;color:white;font-size:22px;width:40px;height:40px;border-radius:50%}#sendBtn{background:#3b82f6;color:white;border:none;padding:12px 20px;border-radius:20px;font-weight:bold}</style></head>
<body><div class="container"><h2>🇸🇸 GAK AI</h2><div id="chatBox"><div class="msg ai">Hello! I am GAK AI.</div></div>
<div class="input-area"><button id="plusBtn" onclick="document.getElementById('photoInput').click()">+</button><input id="userInput" placeholder="Ask..." onkeypress="if(event.key==='Enter')send()"><button id="sendBtn" onclick="send()">Send</button></div>
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handleFile(this)"><div id="filePreview"></div></div>
<script>
const GROQ_API_KEY = "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";
let attachedBase64 = null;
function handleFile(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{attachedBase64=e.target.result;document.getElementById('filePreview').innerHTML=`<img src="${e.target.result}" class="preview"> <span onclick="clearFile()" style="color:red">X</span>`;};r.readAsDataURL(file);}
function clearFile(){attachedBase64=null;document.getElementById('filePreview').innerHTML='';document.getElementById('photoInput').value='';}
async function send(){const input=document.getElementById('userInput');const box=document.getElementById('chatBox');const text=input.value.trim();if(!text&&!attachedBase64)return;box.innerHTML+=`<div class="msg user">You: ${text}</div>`;if(attachedBase64)box.innerHTML+=`<img src="${attachedBase64}" class="preview">`;input.value='';const id='l'+Date.now();box.innerHTML+=`<div class="msg ai" id="${id}">Thinking...</div>`;box.scrollTop=box.scrollHeight;
const models = attachedBase64? ['meta-llama/llama-4-scout-17b-16e-instruct','llama-3.2-11b-vision-preview'] : ['llama-3.1-8b-instant','llama3-8b-8192','llama-3.3-70b-versatile','gemma2-9b-it'];
let success=false;
for(const model of models){try{const body=attachedBase64?{model:model,messages:[{role:'user',content:[{type:'text',text:text||'describe'},{type:'image_url',image_url:{url:attachedBase64}}]}]}:{model:model,messages:[{role:'user',content:text}]};const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_API_KEY},body:JSON.stringify(body)});const data=await res.json();if(data.error){console.log('Model',model,'failed:',data.error.message);if(models.indexOf(model)==models.length-1){document.getElementById(id).innerText='Error: '+data.error.message+' (Key invalid? Check console.groq.com)';}continue;}else{document.getElementById(id).innerText='GAK AI: '+data.choices[0].message.content;success=true;break;}}catch(e){console.log(e);}}
if(!success&&document.getElementById(id).innerText.includes('Thinking')){document.getElementById(id).innerText='Failed. Check API key at console.groq.com/keys';}
clearFile();box.scrollTop=box.scrollHeight;}
</script></body></html>
