<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GAK AI — Built by Isaiah Gak Agok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#121214;color:#fff;font-family:Inter,sans-serif;display:flex;height:100vh;overflow:hidden}
.side{width:270px;background:#17171a;border-right:1px solid #2a2a2e;display:flex;flex-direction:column;padding:16px}
.logo{font-size:26px;font-weight:900;margin-bottom:22px}
.menu div{padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;gap:12px;color:#aaa;margin-bottom:6px;font-size:15px}
.menu div:hover{background:#2a2a30;color:#fff}
.user{margin-top:auto;display:flex;gap:10px;align-items:center;border-top:1px solid #2a2a2e;padding-top:14px}
.ia{width:32px;height:32px;background:#6d5cff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800}
.main{flex:1;display:flex;flex-direction:column;background:#18181b}
.top{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #2a2a2e;font-size:14px}
.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.bubble{max-width:85%;padding:16px 18px;border-radius:18px;line-height:1.6;font-size:16px}
.me{align-self:flex-end;background:#3a3a4a}
.ai{align-self:flex-start;background:#26262c;display:flex;gap:12px}
.ai img{width:100%;max-width:600px;border-radius:14px;margin-top:12px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{background:#3a3a42;border:1px solid #555;padding:10px 16px;border-radius:10px;color:#fff;cursor:pointer;font-size:14px}
.small{font-size:14px;color:#bbb;margin-top:10px;line-height:1.4} /* FIXED - BIG NOW */
.bar{padding:14px;display:flex;gap:10px;align-items:center;background:#1e1e21;border-top:1px solid #2a2a2e}
.bar input{flex:1;background:#2a2a30;border:none;padding:15px 18px;border-radius:24px;color:#fff;outline:none;font-size:16px}
.send{width:46px;height:46px;background:#6d5cff;border-radius:12px;border:none;color:#fff;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="side">
<div class="logo">🤖 GAK AI</div>
<div class="menu">
<div onclick="newChat()">➕ New chat</div>
<div onclick="openGallery()">🖼️ Gallery</div>
<div onclick="openStudio()">✨ Image Studio</div>
<div onclick="openHistory()">🕒 History</div>
<div onclick="openProjects()">📁 Projects</div>
<div style="margin-top:30px" onclick="openHelp()">❓ Help & Support</div>
</div>
<div class="user"><div class="ia">IA</div><div><div style="font-size:13px">Isaiah Gak Agok</div><div style="font-size:11px;color:#888">Free Plan</div></div></div>
</div>
<div class="main">
<div class="top"><div>🤖 GAK AI ▾</div><div>GAK AI • Built by Isaiah Gak Agok</div></div>
<div class="chat" id="chat"></div>
<div class="bar">
<span style="font-size:22px;cursor:pointer">＋</span>
<input id="inp" placeholder="Message GAK AI..." onkeydown="if(event.key==='Enter')go()">
<span style="cursor:pointer">🎤</span><span style="cursor:pointer" onclick="openStudio()">🖼️</span>
<button class="send" onclick="go()">➤</button>
</div>
</div>
<script>
// === PUT YOUR NEW GROQ KEY HERE - BETWEEN THE QUOTES ===
const GROQ_KEY = "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";//
const MODEL = "llama-3.1-8b-instant";

let gallery = JSON.parse(localStorage.getItem('gak_gallery')||'[]');
let chats = JSON.parse(localStorage.getItem('gak_chats')||'[]');

const chatEl = document.getElementById('chat');
function add(t, who, img){
  const d=document.createElement('div'); d.className='bubble '+who;
  if(who==='ai'){
    let h=`<div>🤖</div><div><div>${t}</div>`;
    if(img){ h+=`<img src="${img}"><div class="actions"><button class="btn" onclick="window.open('${img}','_blank')">⬇️ Download</button><button class="btn" onclick="navigator.clipboard.writeText('${img}');alert('Copied!')">🔗 Copy Link</button></div><div class="small">GAK AI Image Studio • Built by Isaiah Gak Agok • South Sudan<br>GAK AI • Built by Isaiah Gak Agok</div>`; }
    else{ h+=`<div class="small">GAK AI • Built by Isaiah Gak Agok • South Sudan 🇸🇸 — Built by Isaiah Gak Agok</div>`; }
    h+=`</div>`; d.innerHTML=h;
  }else{ d.textContent=t; }
  chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
}
add('Hello Cotino! I am <b>GAK AI — Built by Isaiah Gak Agok 🇸🇸</b><br><br>Ask me like <b>"Who is President of South Sudan?"</b> or <b>"generate image of Juba market at sunset"</b>', 'ai');

async function go(){
  const i=document.getElementById('inp'); const txt=i.value.trim(); if(!txt)return;
  add(txt,'me'); chats.push(txt); localStorage.setItem('gak_chats',JSON.stringify(chats)); i.value='';
  if(txt.toLowerCase().includes('generate image')||txt.toLowerCase().includes('image of')){
    const p=txt.replace(/generate image of/gi,'').replace(/generate image/gi,'').trim()||'Juba market at sunset';
    add('Generating image... ⏳','ai');
    const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p+', South Sudan vibrant photorealistic 4k')}?seed=${Date.now()}`;
    setTimeout(()=>{chatEl.lastChild.remove(); add(`Here is the generated image for your request — a vibrant ${p}:`,'ai',url); gallery.push(url); localStorage.setItem('gak_gallery',JSON.stringify(gallery));},1000); return;
  }
  // FALLBACK ANSWER EVEN WITHOUT KEY
  const lower = txt.toLowerCase();
  if(lower.includes('president') && lower.includes('south sudan')){
    add('The President of South Sudan 🇸🇸 is <b>Salva Kiir Mayardit</b>. He has been president since independence in 2011. Capital is Juba.<br><br>GAK AI • Built by Isaiah Gak Agok','ai'); return;
  }
  if(GROQ_KEY.includes('PASTE') || GROQ_KEY.length < 20){
    add('⚠️ Your Groq key is not set! Go to <b>console.groq.com/keys</b> → Create new key → Copy gsk_... → Open GitHub → index.html → Paste it inside GROQ_KEY = "..." → Save → Allow Secret → Wait 2 min.<br><br>But I answered President question for you above even without key!','ai'); return;
  }
  add('Thinking...','ai');
  try{
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'You are GAK AI built by Isaiah Gak Agok from South Sudan. President Salva Kiir. Be helpful.'},{role:'user',content:txt}]})});
    const j=await r.json(); chatEl.lastChild.remove();
    if(j.error){ add('Groq Error: '+j.error.message+' - Create new key at console.groq.com/keys','ai'); } else { add(j.choices[0].message.content,'ai'); }
  }catch(e){ chatEl.lastChild.remove(); add('Error: '+e.message,'ai'); }
}
function newChat(){ chatEl.innerHTML=''; add('New chat started! 🇸🇸','ai'); }
function openGallery(){
  if(gallery.length==0){ add('Gallery is empty! Type "generate image of Juba market" first!','ai'); return; }
  let h='🖼️ <b>Your Gallery:</b><br>'; gallery.forEach(u=> h+=`<img src="${u}" style="width:120px;margin:6px;border-radius:10px">`);
  add(h,'ai');
}
function openStudio(){ add('✨ <b>Image Studio</b><br>Type: <i>generate image of Juba market at sunset</i> or <i>generate image of South Sudan flag</i> — I will create it with Download + Copy Link buttons!','ai'); }
function openHistory(){ add('🕒 <b>History:</b><br>'+ (chats.length? chats.slice(-10).map(c=>'• '+c).join('<br>') : 'No history yet'), 'ai'); }
function openProjects(){ add('📁 <b>Projects:</b><br>1. GAK AI Chat<br>2. GAK AI Image Studio<br>Built by Isaiah Gak Agok','ai'); }
function openHelp(){ add('❓ <b>Help:</b> Contact Isaiah Gak Agok • WhatsApp • Free Plan • If AI not answering, create new Groq key at console.groq.com/keys','ai'); }
</script>
</body>
</html>
