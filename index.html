<!DOCTYPE html>
<html>
<head>
<title>GAK AI - South Sudan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px}
#chat{max-width:700px;margin:auto;background:#1e293b;padding:20px;border-radius:15px}
input{width:70%;padding:12px;border-radius:10px;border:none}
button{padding:12px;border-radius:10px;background:#3b82f6;color:white;border:none;cursor:pointer}
img,video{width:100%;border-radius:10px;margin-top:10px}
canvas{background:white;border-radius:10px;margin-top:10px;padding:10px}
</style>
</head>
<body>
<div id="chat">
<h2>🇸🇸 GAK AI</h2>
<div id="chatBox" style="height:450px;overflow:auto;border:1px solid #334155;padding:10px;border-radius:10px;margin-bottom:10px"></div>
<input id="userInput" placeholder="Ask, generate image, video, chart..." />
<button onclick="send()">Send</button>
</div>
<script>
// >>> PUT YOUR GROQ KEY HERE <<<
const GROQ_API_KEY = "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;

const chatBox = document.getElementById('chatBox');
async function send(){
 const msg = document.getElementById('userInput').value.trim();
 if(!msg) return;
 chatBox.innerHTML += `<p><b>You:</b> ${msg}</p>`;
 document.getElementById('userInput').value="";
 chatBox.innerHTML += `<p id="load"><i>GAK AI thinking...</i></p>`;
 const lower = msg.toLowerCase();

 // 1. IMAGE
 if(lower.includes("generate image")||lower.includes("create image")||lower.startsWith("draw ")){
  const prompt = msg.replace(/generate image|create image|draw/gi,"").trim();
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&model=flux&nologo=true&seed=${Math.floor(Math.random()*9999)}`;
  document.getElementById("load").remove();
  chatBox.innerHTML += `<p><b>GAK AI:</b> Image for "${prompt}"</p><img src="${url}">`;
  return;
 }
 // 2. VIDEO
 if(lower.includes("generate video")||lower.includes("create video")){
  const prompt = msg.replace(/generate video|create video/gi,"").trim();
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=video`;
  document.getElementById("load").remove();
  chatBox.innerHTML += `<p><b>GAK AI:</b> Video for "${prompt}"</p><video controls autoplay loop muted><source src="${url}" type="video/mp4"></video>`;
  return;
 }
 // 3. CHART
 if(lower.includes("chart")||lower.includes("graph")||lower.includes("plot")){
  document.getElementById("load").remove();
  const id = "chart"+Date.now();
  chatBox.innerHTML += `<p><b>GAK AI:</b> Chart</p><canvas id="${id}"></canvas>`;
  setTimeout(()=>{ new Chart(document.getElementById(id),{type:'bar',data:{labels:['Juba','Wau','Malakal','Bor','Yei','Yambio'],datasets:[{label:'Population Example',data:[12,19,8,15,11,9],backgroundColor:'#3b82f6'}]}})},300);
  return;
 }

 // 4. CHAT WITH GROQ
 try{
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{"Authorization":`Bearer ${GROQ_API_KEY}`,"Content-Type":"application/json"},
   body:JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"system",content:"You are GAK AI from South Sudan by Isaiah Gak."},{role:"user",content:msg}]})
  });
  const data = await res.json();
  document.getElementById("load").remove();
  chatBox.innerHTML += `<p><b>GAK AI:</b> ${data.choices[0].message.content}</p>`;
 }catch(e){
  document.getElementById("load").remove();
  chatBox.innerHTML += `<p style="color:red">Error: Check API key - ${e.message}</p>`;
 }
}
</script>
</body>
</html>
