<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAK AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
}

/* SIDEBAR */
#sidebar {
    width: 270px;
    background: #1e293b;
    padding: 20px;
    overflow-y: auto;
}

#sidebar h2 {
    margin-top: 0;
}

.small-text {
    color: #94a3b8;
    font-size: 13px;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 15px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
}

input:focus,
select:focus {
    outline: 2px solid #2563eb;
}

hr {
    border: none;
    border-top: 1px solid #334155;
    margin: 20px 0;
}

label {
    font-size: 13px;
    color: #cbd5e1;
}

#apiStatus {
    font-size: 12px;
    margin-top: -8px;
    margin-bottom: 15px;
}

/* MAIN */
#main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

#header {
    padding: 20px;
    border-bottom: 1px solid #334155;
}

#header h1 {
    margin: 0;
    font-size: 28px;
}

#header p {
    margin-bottom: 0;
    color: #94a3b8;
}

/* CHAT */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    display: flex;
    margin-bottom: 15px;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.user .bubble {
    background: #2563eb;
}

.assistant .bubble {
    background: #334155;
}

/* INPUT AREA */
#inputArea {
    padding: 15px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #334155;
}

#userInput {
    flex: 1;
    margin: 0;
}

#sendButton {
    width: 90px;
    margin: 0;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

#sendButton:hover {
    background: #1d4ed8;
}

#sendButton:disabled {
    background: #475569;
    cursor: not-allowed;
}

/* MOBILE */
@media (max-width: 700px) {

    body {
        flex-direction: column;
    }

    #sidebar {
        width: 100%;
        max-height: 300px;
    }

    #main {
        min-height: 60vh;
    }

    .bubble {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div id="sidebar">

    <h2>⚙️ GAK AI</h2>

    <p class="small-text">
        Powered by Groq AI
    </p>

    <hr>

    <h3>🔑 API Key</h3>

    <p class="small-text">
        Paste your Groq API key below.
    </p>

    <input
        type="password"
        id="apiKeyInput"
        placeholder="gsk_..."
    >

    <div id="apiStatus">
        🔴 API key not entered
    </div>

    <hr>

    <h3>🧠 Engine Mode</h3>

    <select id="engineMode">

        <option value="auto">
            Auto / Dual Brain
        </option>

        <option value="global">
            Global Intelligence
        </option>

        <option value="local">
            South Sudan / Local Focus
        </option>

    </select>

    <h3>🎬 Media Generation</h3>

    <label>
        <input
            type="checkbox"
            id="enableVideo"
            checked
            style="width:auto;"
        >
        Enable Video Studio
    </label>

    <select id="videoEngine">

        <option value="luma">
            Luma Dream Machine
        </option>

        <option value="runway">
            Runway
        </option>

    </select>

    <hr>

    <p class="small-text">
        🇸🇸 Created for GAK AI
    </p>

</div>


<!-- ================= MAIN ================= -->

<div id="main">

    <div id="header">

        <h1>⚡ GAK AI</h1>

        <p>
            Your intelligent AI assistant
        </p>

    </div>


    <!-- CHAT -->

    <div id="chat">

        <div class="message assistant">

            <div class="bubble">
                👋 Hello! I am GAK AI.

                Ask me anything and I will try to help you.
            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div id="inputArea">

        <input
            type="text"
            id="userInput"
            placeholder="Message GAK AI..."
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>

    </div>

</div>


<script>

/* =========================================================
   GAK AI CONFIGURATION
   ========================================================= */

const CONFIG = {

    /*
       PASTE YOUR REAL GROQ API KEY HERE.

       Example:

       GROQ_API_KEY: "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";//

       OR you can paste it into the API Key box
       on the left side of the website.
    */

    GROQ_API_KEY: "PASTE_YOUR_GROQ_KEY_HERE",

    /*
       IMPORTANT:

       llama-3.1-8b-instant was deprecated.

       We use the newer Groq model:
    */

    MODEL: "openai/gpt-oss-20b",

    API_URL:
        "https://api.groq.com/openai/v1/chat/completions"
};


/* =========================================================
   ELEMENTS
   ========================================================= */

const chat =
    document.getElementById("chat");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const apiKeyInput =
    document.getElementById("apiKeyInput");

const apiStatus =
    document.getElementById("apiStatus");

const engineMode =
    document.getElementById("engineMode");


/* =========================================================
   API KEY STATUS
   ========================================================= */

apiKeyInput.addEventListener("input", function () {

    if (apiKeyInput.value.trim().startsWith("gsk_")) {

        apiStatus.innerHTML =
            "🟢 API key detected";

        apiStatus.style.color =
            "#22c55e";

    } else {

        apiStatus.innerHTML =
            "🔴 Enter a valid Groq API key";

        apiStatus.style.color =
            "#ef4444";
    }

});


/* =========================================================
   GET API KEY
   ========================================================= */

function getApiKey() {

    const typedKey =
        apiKeyInput.value.trim();

    if (typedKey) {
        return typedKey;
    }

    if (
        CONFIG.GROQ_API_KEY &&
        CONFIG.GROQ_API_KEY !==
        "PASTE_YOUR_GROQ_KEY_HERE"
    ) {

        return CONFIG.GROQ_API_KEY;

    }

    return "";
}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


/* =========================================================
   SYSTEM PROMPT
   ========================================================= */

function getSystemPrompt() {

    let prompt = `
You are GAK AI, an intelligent AI assistant.

You were created for the GAK AI project.

Be helpful, clear, accurate and easy to understand.

When the user asks a question, answer the actual question directly.

Do not pretend that you performed an action if you did not.

If you do not know something, say so clearly.

Help with:
- programming
- business
- education
- technology
- writing
- mathematics
- general knowledge
- South Sudan-related topics
- entrepreneurship
- AI
`;

    const mode =
        engineMode.value;

    if (mode === "local") {

        prompt += `
Pay special attention to South Sudan and East African
contexts when relevant.

Consider realities such as:
- Juba
- South Sudan
- local businesses
- local markets
- internet availability
- mobile money
- developing-economy constraints
`;

    }

    if (mode === "global") {

        prompt += `
Focus primarily on global knowledge,
international best practices and technical solutions.
`;

    }

    if (mode === "auto") {

        prompt += `
When appropriate, combine global knowledge with
South Sudan and East African realities.
`;

    }

    return prompt;
}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    const question =
        userInput.value.trim();

    if (!question) {
        return;
    }


    /* GET KEY */

    const apiKey =
        getApiKey();

    if (!apiKey) {

        addMessage(
            "⚠️ Please enter your Groq API key in the box on the left.",
            "assistant"
        );

        return;
    }


    /* USER MESSAGE */

    addMessage(
        question,
        "user"
    );

    userInput.value = "";

    sendButton.disabled = true;

    sendButton.textContent =
        "Thinking...";


    /* LOADING MESSAGE */

    const loading =
        addMessage(
            "🤔 GAK AI is thinking...",
            "assistant"
        );


    try {

        /* =====================================================
           GROQ REQUEST
           ===================================================== */

        const response =
            await fetch(
                CONFIG.API_URL,
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + apiKey
                    },

                    body:
                        JSON.stringify({

                            model:
                                CONFIG.MODEL,

                            messages: [

                                {
                                    role:
                                        "system",

                                    content:
                                        getSystemPrompt()
                                },

                                {
                                    role:
                                        "user",

                                    content:
                                        question
                                }

                            ]

                        })
                }
            );


        /* GET RESPONSE */

        const data =
            await response.json();


        /* REMOVE LOADING */

        loading.remove();


        /* =====================================================
           HANDLE API ERRORS
           ===================================================== */

        if (!response.ok) {

            let errorMessage =
                "Unknown API error.";

            if (
                data &&
                data.error &&
                data.error.message
            ) {

                errorMessage =
                    data.error.message;

            }

            addMessage(
                "⚠️ Groq API Error:\n\n" +
                errorMessage,
                "assistant"
            );

            return;
        }


        /* =====================================================
           GET AI RESPONSE
           ===================================================== */

        if (
            !data.choices ||
            !data.choices.length
        ) {

            addMessage(
                "⚠️ GAK AI received an unexpected response from the AI server.",
                "assistant"
            );

            return;
        }


        const answer =
            data
            .choices[0]
            .message
            .content;


        addMessage(
            answer,
            "assistant"
        );


    } catch (error) {

        loading.remove();

        addMessage(
            "⚠️ Connection error.\n\n" +
            error.message +
            "\n\nCheck your internet connection and API key.",
            "assistant"
        );

    } finally {

        sendButton.disabled =
            false;

        sendButton.textContent =
            "Send";

        userInput.focus();

    }

}


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
   ========================================================= */

userInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   STARTUP
   ========================================================= */

userInput.focus();

</script>

</body>
</html>
