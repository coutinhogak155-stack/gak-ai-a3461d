<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GAK AI — Built by Isaiah Gak Agok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#121214;color:#fff;font-family:Inter,sans-serif;display:flex;height:100vh}
.side{width:270px;background:#1a1a1d;border-right:1px solid #2a2a2e;display:flex;flex-direction:column;padding:16px}
.logo{display:flex;gap:10px;align-items:center;font-size:26px;font-weight:800;margin-bottom:24px}
.menu div{padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;gap:12px;color:#aaa;margin-bottom:6px}
.menu div.active{background:#2a2a30;color:#fff}
.user{margin-top:auto;display:flex;gap:10px;align-items:center;border-top:1px solid #2a2a2e;padding-top:14px}
.ia{width:32px;height:32px;background:#6d5cff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800}
.main{flex:1;display:flex;flex-direction:column;background:#18181b}
.top{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #2a2a2e}
.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.bubble{max-width:85%;padding:14px 16px;border-radius:18px;line-height:1.5}
.me{align-self:flex-end;background:#2f2f38}
.ai{align-self:flex-start;background:#26262c;display:flex;gap:12px}
.ai img{width:100%;border-radius:14px;margin-top:10px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{background:#3a3a42;border:1px solid #4a4a55;padding:8px 14px;border-radius:10px;color:#fff;cursor:pointer;font-size:13px}
.bar{padding:14px;display:flex;gap:10px;align-items:center;background:#1e1e21;border-top:1px solid #2a2a2e}
.bar input{flex:1;background:#2a2a30;border:none;padding:14px 18px;border-radius:24px;color:#fff;outline:none;font-size:15px}
.send{width:42px;height:42px;background:#6d5cff;border-radius:12px;border:none;color:#fff;font-size:18px;cursor:pointer}
.small{font-size:11px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="side">
<div class="logo">🤖 GAK AI</div>
<div class="menu">
<div class="active">➕ New chat</div>
<div>🖼️ Gallery</div>
<div>✨ Image Studio</div>
<div>🕒 History</div>
<div>📁 Projects</div>
<div style="margin-top:30px">❓ Help & Support</div>
</div>
<div class="user"><div class="ia">IA</div><div><div style="font-size:13px">Isaiah Gak Agok</div><div style="font-size:11px;color:#888">Free Plan</div></div></div>
</div>
<div class="main">
<div class="top"><div>🤖 GAK AI ▾</div><div style="font-size:11px;color:#777">GAK AI • Built by Isaiah Gak Agok</div></div>
<div class="chat" id="chat"></div>
<div class="bar">
<span style="font-size:20px">＋</span>
<input id="inp" placeholder="Message GAK AI..." onkeydown="if(event.key==='Enter')go()">
<span>🎤</span><span>🖼️</span>
<button class="send" onclick="go()">➤</button>
</div>
</div>
<script>
// ===== YOUR KEY IS HIDDEN HERE - NO BOX NEEDED! =====
const GROQ_KEY = "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";
const MODEL = "llama-3.1-8b-instant";

const chatEl = document.getElementById('chat');
function add(t, who, img){
  const d=document.createElement('div'); d.className='bubble '+who;
  if(who==='ai'){
    let h=`<div>🤖</div><div><div>${t}</div>`;
    if(img){ h+=`<img src="${img}"><div class="actions"><button class="btn" onclick="window.open('${img}','_blank')">⬇️ Download</button><button class="btn" onclick="navigator.clipboard.writeText('${img}');alert('Link Copied!')">🔗 Copy Link</button></div><div class="small">GAK AI Image Studio • Built by Isaiah Gak Agok • South Sudan<br>GAK AI • Built by Isaiah Gak Agok</div>`; }
    else{ h+=`<div class="small">GAK AI • Built by Isaiah Gak Agok • South Sudan 🇸🇸</div>`; }
    h+=`</div>`; d.innerHTML=h;
  }else{ d.textContent=t; }
  chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
}
add('Hello Cotino! I am <b>GAK AI — Built by Isaiah Gak Agok</b> 🇸🇸<br><br>Ask me like "Who is President of South Sudan?" or "generate image of Juba market at sunset"', 'ai');

async function go(){
  const i=document.getElementById('inp'); const txt=i.value.trim(); if(!txt)return;
  add(txt,'me'); i.value='';
  if(txt.toLowerCase().includes('generate image')||txt.toLowerCase().includes('image of')){
    const p=txt.replace(/generate image of/gi,'').trim()||'Juba market at sunset';
    add('Generating... ⏳','ai');
    const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p+', South Sudan market, vibrant, photorealistic, 4k')}?seed=${Date.now()}`;
    setTimeout(()=>{chatEl.lastChild.remove(); add(`Here is the generated image for your request — a vibrant ${p}:`,'ai',url);},1200); return;
  }
  add('Thinking...','ai');
  try{
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'You are GAK AI, built by Isaiah Gak Agok from South Sudan. President is Salva Kiir Mayardit. Capital Juba. Always say Built by Isaiah Gak Agok.'},{role:'user',content:txt}]})});
    const j=await r.json(); chatEl.lastChild.remove();
    add(j.choices?.[0]?.message?.content||'Error: check Groq key - go to console.groq.com and create new key','ai');
  }catch(e){ chatEl.lastChild.remove(); add('Error: '+e.message,'ai'); }
}
</script>
</body>
</html>
