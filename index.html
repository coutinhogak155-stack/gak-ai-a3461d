<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAK AI - Dual-Brain Intelligence</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; margin:0; display:flex; height:100vh; }
        #sidebar { width: 280px; background: #1e293b; padding: 20px; }
        #main { flex:1; display:flex; flex-direction:column; }
        #chat { flex:1; overflow-y:auto; padding:20px; }
        .msg { padding:10px 15px; margin:10px; border-radius:12px; max-width:80%; }
        .user { background:#2563eb; align-self:flex-end; margin-left:auto; }
        .assistant { background:#334155; }
        input, select { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:none; }
        button { background:#2563eb; color:white; padding:10px; border:none; border-radius:8px; cursor:pointer; width:100%; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>⚙️ GAK AI Settings</h2>
    <p style="font-size:12px; color:#94a3b8;">Paste your key below</p>
    <input type="password" id="apiKeyInput" placeholder="gsk_... paste here">
    
    <hr style="margin:20px 0; border-color:#334155;">
    
    <h3>Engine Mode</h3>
    <select id="engineMode">
        <option value="auto">Auto-Detect (Dual-Brain)</option>
        <option value="global">Global Logic Only</option>
        <option value="local">Local Market / Regional Focus</option>
    </select>

    <h3>Media Generation</h3>
    <label><input type="checkbox" id="enableVideo" checked> Enable GAK Video Studio</label>
    <select id="videoEngine">
        <option>Fal.ai / Luma Dream Machine</option>
        <option>Runway Gen-3</option>
    </select>
    <p style="margin-top:30px; font-size:11px;">Created by Isaiah Gak Agok - South Sudan</p>
</div>

<div id="main">
    <div style="padding:20px; border-bottom:1px solid #334155;">
        <h1>⚡ GAK AI</h1>
        <p style="color:#94a3b8;">Your Dual-Brain Intelligence: Global Logic, Local Market Reality & Video Generation</p>
    </div>
    <div id="chat"></div>
    <div style="padding:20px; display:flex; gap:10px;">
        <input type="text" id="userInput" placeholder="Message GAK AI...">
        <button onclick="sendMessage()" style="width:80px;">Send</button>
    </div>
</div>

<script>
// =================================================================
// PASTE YOUR API KEY HERE - EASY TO EDIT
// =================================================================
const CONFIG = {
  
    GROQ_API_KEY: "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";// 
    MODEL: "llama-3.1-8b-instant"
};
// =================================================================

async function sendMessage() {
    const input = document.getElementById('userInput');
    const chat = document.getElementById('chat');
    const apiKeyFromInput = document.getElementById('apiKeyInput').value.trim();
    const finalApiKey = apiKeyFromInput || CONFIG.GROQ_API_KEY;
    const mode = document.getElementById('engineMode').value;

    if (!input.value) return;
    if (finalApiKey.includes("xxxx") || finalApiKey.length < 20) {
        alert("⚠️ Please paste your real Groq API key at top of code or in sidebar!");
        return;
    }

    // Show user msg
    chat.innerHTML += `<div class="msg user">${input.value}</div>`;
    const userPrompt = input.value;
    input.value = "";

    // Build Dual-Brain System Prompt
    let systemPrompt = "You are GAK AI, advanced assistant by Isaiah Gak Agok, South Sudanese AI builder.";
    if (mode === "local") systemPrompt += " Prioritize local market, developing economy, grassroots trade, Juba/South Sudan realities.";
    if (mode === "auto") systemPrompt += " Blend global technical knowledge with localized South Sudan economic constraints.";
    if (mode === "global") systemPrompt += " Focus on global best practices and logic.";

    // Show loading
    chat.innerHTML += `<div class="msg assistant" id="loading">Thinking...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${finalApiKey}`
            },
            body: JSON.stringify({
                model: CONFIG.MODEL,
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: userPrompt }
                ],
                temperature: 0.7
            })
        });

        const data = await response.json();
        document.getElementById('loading').remove();

        if (data.error) {
            chat.innerHTML += `<div class="msg assistant">⚠️ Error: ${data.error.message}</div>`;
        } else {
            let reply = data.choices[0].message.content;
            
            // Video check
            const videoKeywords = ["generate video", "create a video", "video of"];
            if (document.getElementById('enableVideo').checked && videoKeywords.some(k => userPrompt.toLowerCase().includes(k))) {
                reply += `<br><br>🎬 <b>GAK Video Studio:</b> Sending to ${document.getElementById('videoEngine').value}... (Connect API to render MP4 here)`;
            }
            chat.innerHTML += `<div class="msg assistant">${reply}</div>`;
        }
    } catch (e) {
        document.getElementById('loading').remove();
        chat.innerHTML += `<div class="msg assistant">⚠️ Network Error: ${e.message}</div>`;
    }
    chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
